# V4L2 TCP pipeline default configuration.
# Priority: built-in defaults < this config file < command line arguments.

# Camera
device=/dev/video0
width=640
height=360
format=YUYV
mmap_buffers=4

# Capture mode
pipeline_frames=300
timeout_ms=2000

# Queues
ring_capacity=8
tcp_queue_capacity=8
consumer_delay_ms=0

# TCP output
tcp_host=127.0.0.1
tcp_port=9000

# Local output
output_dir=output
pipeline_save=false
save_limit=5

# Logging placeholder for the next stage.
# Supported: DEBUG, INFO, WARN, ERROR
log_level=INFO

stats_output=output/stats/pipeline_stats.json
